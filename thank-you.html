<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#08090a;
  --navy:#0d1b2a;
  --blue:#2B7BE8;
  --blue-dark:#1a5cbe;
  --blue-dim:rgba(43,123,232,0.12);
  --white:#f5f6f7;
  --muted:rgba(245,246,247,0.55);
  --border:rgba(255,255,255,0.07);
  --border-blue:rgba(43,123,232,0.3);
}
html,body{height:100%;}
body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;font-weight:300;display:flex;flex-direction:column;min-height:100vh;}

nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 48px;background:rgba(8,9,10,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.nav-logo-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;}
.nav-logo-text{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--white);white-space:nowrap;line-height:1;}
.nav-logo-text span{color:var(--blue);}
.nav-reviews{display:flex;align-items:center;gap:5px;line-height:1;}
.nav-stars{display:flex;gap:1px;}
.nav-star{color:#FFB800;font-size:11px;}
.nav-review-count{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);white-space:nowrap;}

.ty-main{flex:1;display:flex;align-items:center;justify-content:center;padding:100px 24px 60px;}
.ty-card{max-width:760px;width:100%;text-align:center;}
.ty-icon{width:40px;height:40px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:popIn 0.5s ease both;}
@keyframes popIn{from{opacity:0;transform:scale(0.5);}to{opacity:1;transform:scale(1);}}
.ty-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:14px;animation:fadeUp 0.6s 0.2s both;}
.ty-headline{font-family:'Anton',sans-serif;font-size:clamp(38px,5.2vw,64px);line-height:0.98;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:16px;animation:fadeUp 0.6s 0.3s both;}
.ty-headline .blue{color:var(--blue);}
.ty-sub{font-size:15px;color:var(--muted);line-height:1.75;max-width:480px;margin:0 auto 32px;animation:fadeUp 0.6s 0.4s both;}
.ty-video-wrap{width:100%;border-radius:4px;overflow:hidden;border:1px solid var(--border-blue);animation:fadeUp 0.6s 0.5s both;background:var(--navy);box-shadow:0 0 48px rgba(43,123,232,0.2);}
.ty-video-wrap video{width:100%;display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

footer{padding:24px 48px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.footer-logo{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--white);}
.footer-logo span{color:var(--blue);}
.footer-copy{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:rgba(245,246,247,0.25);}

@media(max-width:600px){
  nav{padding:12px 20px;gap:12px;}
  .nav-logo-text{font-size:18px;letter-spacing:2px;}
  .ty-main{padding:80px 20px 40px;}
  footer{padding:20px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo-wrap">
    <div class="nav-logo-text"><span>TANG</span> DETAILING</div>
    <div class="nav-reviews">
      <div class="nav-stars">
        <span class="nav-star">★</span><span class="nav-star">★</span><span class="nav-star">★</span><span class="nav-star">★</span><span class="nav-star">★</span>
      </div>
      <span class="nav-review-count">150+</span>
    </div>
  </div>
</nav>

<main class="ty-main">
  <div class="ty-card">
    <div class="ty-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 class="ty-headline">YOU'RE ONE STEP<br>CLOSER TO <span class="blue">PROTECTED</span> PAINT.</h1>
    <p class="ty-sub">Tang has your request. Watch the short video below — he walks you through exactly what happens next.</p>
    <div class="ty-video-wrap">
      <video autoplay playsinline controls>
        <source src="/videos/thankyou-video.mp4" type="video/mp4">
      </video>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo"><span>TANG</span> DETAILING</div>
  <div class="footer-copy">© 2025 Tang Detailing · Raleigh, NC</div>
</footer>

</body>
</html>
